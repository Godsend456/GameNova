<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GameNova Shooter</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  background: #101522;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 5;
}

.stat {
  background: rgba(0,0,0,.65);
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: bold;
}

#healthBar {
  position: fixed;
  top: 55px;
  left: 10px;
  width: 160px;
  height: 14px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  z-index: 5;
}

#health {
  width: 100%;
  height: 100%;
  background: #22c55e;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  height: 150px;
  z-index: 10;
  pointer-events: none;
}

#joystick {
  position: absolute;
  left: 25px;
  bottom: 10px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  border: 2px solid rgba(255,255,255,.25);
  pointer-events: auto;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  left: 31px;
  top: 31px;
  border-radius: 50%;
  background: #8b5cf6;
}

#shoot {
  position: absolute;
  right: 25px;
  bottom: 10px;
  width: 115px;
  height: 115px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.35);
  background: #ef4444;
  color: white;
  font-size: 22px;
  font-weight: bold;
  pointer-events: auto;
  box-shadow: 0 5px 20px rgba(239,68,68,.4);
}

#shoot:active {
  transform: scale(.92);
  background: #dc2626;
}

#message {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.78);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 20;
  text-align: center;
}

#message h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

#message p {
  font-size: 20px;
  margin-bottom: 20px;
}

#restart {
  border: none;
  background: #8b5cf6;
  color: white;
  padding: 14px 28px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="game">
  <canvas id="canvas"></canvas>
</div>

<div id="hud">
  <div class="stat">Score: <span id="score">0</span></div>
  <div class="stat">Wave: <span id="wave">1</span></div>
</div>

<div id="healthBar">
  <div id="health"></div>
</div>

<div id="controls">
  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="shoot">SHOOT</button>
</div>

<div id="message">
  <h1>GAME OVER</h1>
  <p>Score: <span id="finalScore">0</span></p>
  <button id="restart">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

/* PLAYER */

const player = {
  x: W / 2,
  y: H / 2,
  radius: 18,
  speed: 4,
  health: 100,
  angle: 0
};

let bullets = [];
let enemies = [];
let particles = [];

let score = 0;
let wave = 1;
let gameOver = false;
let shootHeld = false;
let lastShot = 0;
let enemyTimer = 0;

/* KEYBOARD */

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    shootHeld = true;
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;

  if (e.code === "Space") {
    shootHeld = false;
  }
});

/* JOYSTICK */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joyX = 0;
let joyY = 0;
let joyActive = false;

function updateJoystick(x, y) {
  const rect = joystick.getBoundingClientRect();

  let dx = x - (rect.left + rect.width / 2);
  let dy = y - (rect.top + rect.height / 2);

  const max = 45;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance > max) {
    dx = dx / distance * max;
    dy = dy / distance * max;
  }

  joyX = dx / max;
  joyY = dy / max;

  stick.style.transform =
    `translate(${dx}px, ${dy}px)`;
}

function resetJoystick() {
  joyX = 0;
  joyY = 0;
  stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("pointerdown", e => {
  joyActive = true;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e.clientX, e.clientY);
});

joystick.addEventListener("pointermove", e => {
  if (joyActive) {
    updateJoystick(e.clientX, e.clientY);
  }
});

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

/* SHOOT BUTTON */

const shootButton = document.getElementById("shoot");

shootButton.addEventListener("pointerdown", e => {
  shootHeld = true;
  e.preventDefault();
});

shootButton.addEventListener("pointerup", () => {
  shootHeld = false;
});

shootButton.addEventListener("pointercancel", () => {
  shootHeld = false;
});

/* SHOOTING */

function shoot() {
  const now = Date.now();

  if (now - lastShot < 180) return;

  lastShot = now;

  /*
    Find nearest enemy.
    This makes shooting work naturally on mobile.
  */

  let target = null;
  let nearest = Infinity;

  for (const enemy of enemies) {
    const dx = enemy.x - player.x;
    const dy = enemy.y - player.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < nearest) {
      nearest = distance;
      target = enemy;
    }
  }

  let angle = player.angle;

  if (target) {
    angle = Math.atan2(
      target.y - player.y,
      target.x - player.x
    );
  }

  bullets.push({
    x: player.x + Math.cos(angle) * 22,
    y: player.y + Math.sin(angle) * 22,
    vx: Math.cos(angle) * 10,
    vy: Math.sin(angle) * 10,
    radius: 5,
    life: 80
  });

  createParticles(
    player.x + Math.cos(angle) * 25,
    player.y + Math.sin(angle) * 25,
    "#facc15",
    4
  );
}

/* ENEMIES */

function spawnEnemy() {

  const side = Math.floor(Math.random() * 4);

  let x, y;

  if (side === 0) {
    x = -30;
    y = Math.random() * H;
  } else if (side === 1) {
    x = W + 30;
    y = Math.random() * H;
  } else if (side === 2) {
    x = Math.random() * W;
    y = -30;
  } else {
    x = Math.random() * W;
    y = H + 30;
  }

  const size = 15 + Math.random() * 10;

  enemies.push({
    x,
    y,
    radius: size,
    speed: 0.8 + wave * 0.08,
    health: 1 + Math.floor(wave / 3)
  });
}

/* PARTICLES */

function createParticles(x, y, color, amount) {

  for (let i = 0; i < amount; i++) {

    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3;

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30,
      color
    });
  }
}

/* UPDATE */

function update() {

  if (gameOver) return;

  /* MOVEMENT */

  let moveX = joyX;
  let moveY = joyY;

  if (keys["w"] || keys["arrowup"]) moveY -= 1;
  if (keys["s"] || keys["arrowdown"]) moveY += 1;
  if (keys["a"] || keys["arrowleft"]) moveX -= 1;
  if (keys["d"] || keys["arrowright"]) moveX += 1;

  const length = Math.sqrt(
    moveX * moveX + moveY * moveY
  );

  if (length > 0) {
    moveX /= length;
    moveY /= length;

    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    player.angle = Math.atan2(moveY, moveX);
  }

  /* KEEP PLAYER INSIDE */

  player.x = Math.max(
    player.radius,
    Math.min(W - player.radius, player.x)
  );

  player.y = Math.max(
    player.radius,
    Math.min(H - player.radius, player.y)
  );

  /* SHOOT */

  if (shootHeld) {
    shoot();
  }

  /* SPAWN ENEMIES */

  enemyTimer++;

  const spawnRate = Math.max(
    25,
    90 - wave * 4
  );

  if (enemyTimer > spawnRate) {
    spawnEnemy();
    enemyTimer = 0;
  }

  /* BULLETS */

  for (let i = bullets.length - 1; i >= 0; i--) {

    const b = bullets[i];

    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    if (
      b.life <= 0 ||
      b.x < -50 ||
      b.x > W + 50 ||
      b.y < -50 ||
      b.y > H + 50
    ) {
      bullets.splice(i, 1);
      continue;
    }

    /* BULLET / ENEMY */

    for (let j = enemies.length - 1; j >= 0; j--) {

      const e = enemies[j];

      const dx = b.x - e.x;
      const dy = b.y - e.y;

      const distance = Math.sqrt(
        dx * dx + dy * dy
      );

      if (distance < b.radius + e.radius) {

        e.health--;

        bullets.splice(i, 1);

        createParticles(
          e.x,
          e.y,
          "#ef4444",
          8
        );

        if (e.health <= 0) {

          enemies.splice(j, 1);

          score += 10;

          document.getElementById("score").textContent =
            score;

          if (score % 100 === 0) {
            wave++;
            document.getElementById("wave").textContent =
              wave;
          }
        }

        break;
      }
    }
  }

  /* ENEMIES */

  for (const e of enemies) {

    const dx = player.x - e.x;
    const dy = player.y - e.y;

    const distance = Math.sqrt(
      dx * dx + dy * dy
    );

    if (distance > 0) {

      e.x += dx / distance * e.speed;
      e.y += dy / distance * e.speed;
    }

    /* ENEMY HITS PLAYER */

    if (
      distance <
      player.radius + e.radius
    ) {

      player.health -= 0.7;

      e.x -= dx / distance * 2;
      e.y -= dy / distance * 2;

      updateHealth();

      if (player.health <= 0) {
        endGame();
      }
    }
  }

  /* PARTICLES */

  for (let i = particles.length - 1; i >= 0; i--) {

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

/* HEALTH */

function updateHealth() {

  const health = Math.max(
    0,
    player.health
  );

  document.getElementById("health").style.width =
    health + "%";
}

/* DRAW */

function draw() {

  ctx.clearRect(0, 0, W, H);

  /* BACKGROUND */

  ctx.fillStyle = "#101522";
  ctx.fillRect(0, 0, W, H);

  /* GRID */

  ctx.strokeStyle = "rgba(255,255,255,.05)";
  ctx.lineWidth = 1;

  const grid = 40;

  for (let x = 0; x < W; x += grid) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += grid) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  /* BULLETS */

  for (const b of bullets) {

    ctx.beginPath();
    ctx.arc(
      b.x,
      b.y,
      b.radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#facc15";
    ctx.fill();
  }

  /* ENEMIES */

  for (const e of enemies) {

    ctx.beginPath();
    ctx.arc(
      e.x,
      e.y,
      e.radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#ef4444";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      e.x,
      e.y,
      e.radius * .4,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#7f1d1d";
    ctx.fill();
  }

  /* PLAYER */

  ctx.save();

  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  /* GUN */

  ctx.fillStyle = "#d1d5db";
  ctx.fillRect(8, -5, 25, 10);

  /* BODY */

  ctx.beginPath();
  ctx.arc(
    0,
    0,
    player.radius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#8b5cf6";
  ctx.fill();

  ctx.strokeStyle = "#c4b5fd";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();

  /* PARTICLES */

  for (const p of particles) {

    ctx.globalAlpha = p.life / 30;

    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

/* GAME OVER */

function endGame() {

  gameOver = true;

  document.getElementById("finalScore").textContent =
    score;

  document.getElementById("message").style.display =
    "flex";
}

/* RESTART */

document.getElementById("restart").addEventListener(
  "click",
  () => {

    player.x = W / 2;
    player.y = H / 2;
    player.health = 100;

    bullets = [];
    enemies = [];
    particles = [];

    score = 0;
    wave = 1;
    enemyTimer = 0;
    gameOver = false;

    document.getElementById("score").textContent = "0";
    document.getElementById("wave").textContent = "1";

    updateHealth();

    document.getElementById("message").style.display =
      "none";
  }
);

/* GAME LOOP */

function gameLoop() {

  update();
  draw();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
  </html>
